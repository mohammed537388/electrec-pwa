name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        run: node build.mjs

      - name: Setup Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js icons assets www/
          node node_modules/@capacitor/cli/bin/capacitor init "شمسي" "com.shamsi.solar" --web-dir www --confirm
          node node_modules/@capacitor/cli/bin/capacitor copy android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shamsi-apk
          path: android/app/build/outputs/apk/debug/*.apk
