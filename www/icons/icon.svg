<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#skyGrad)" stroke="#fcd34d" stroke-width="4"/>
  
  <!-- Sun rays (12 rays) -->
  <g stroke="url(#sunGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="60" x2="256" y2="30"/>
    <line x1="256" y1="482" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="30" y2="256"/>
    <line x1="482" y1="256" x2="452" y2="256"/>
    <line x1="102" y1="102" x2="70" y2="70"/>
    <line x1="442" y1="442" x2="410" y2="410"/>
    <line x1="102" y1="410" x2="70" y2="442"/>
    <line x1="442" y1="70" x2="410" y2="102"/>
  </g>
  
  <!-- Sun body -->
  <circle cx="256" cy="256" r="110" fill="url(#sunGrad)" filter="url(#glow)">
    <animate attributeName="r" values="110;115;110" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
  
  <!-- Lightning bolt (centered) -->
  <path d="M256 100 L220 180 L240 180 L208 272 L288 180 L256 180 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)"
        transform-origin="256 256">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Inner highlight on bolt -->
  <path d="M256 100 L220 180 L240 180 L208 272 L288 180 L256 180 Z" 
        fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"
        filter="url(#innerGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Subtle pulse ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="130;160" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>